name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Resolve Packages
        run: |
          xcodebuild \
            -project LlamaIOS.xcodeproj \
            -scheme LlamaIOS \
            -resolvePackageDependencies

      - name: Build
        run: |
          set -o pipefail

          xcodebuild \
            -project LlamaIOS.xcodeproj \
            -scheme LlamaIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show Swift compiler errors
        if: failure()
        run: |
          echo "===== SWIFT ERRORS ====="
          grep -n -E '(^|[[:space:]])error:' build.log || true

          echo "===== SWIFT COMPILE FAILURES ====="
          grep -n -E 'CompileSwift|SwiftCompile' build.log || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LlamaIOS.app Payload/
          zip -r LlamaIOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LlamaIOS-unsigned
          path: LlamaIOS-unsigned.ipa
