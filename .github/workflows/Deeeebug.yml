name: Xcode Debug

on:

  workflow_dispatch:

jobs:

  debug:

    runs-on: macos-15

    steps:

      - name: Check Xcode

        run: |

          echo "=== xcode-select ==="

          xcode-select -p

          echo "=== Xcode ==="

          xcodebuild -version

          echo "=== Swift ==="

          swift --version
