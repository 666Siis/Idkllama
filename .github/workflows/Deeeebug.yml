name: Deeeebug

on:

  workflow_dispatch:

jobs:

  debug:

    runs-on: macos-15

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Select Xcode 16.4

        run: |

          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Check Xcode and Swift

        run: |

          echo "=== xcode-select ==="

          xcode-select -p

          echo "=== Xcode ==="

          xcodebuild -version

          echo "=== Swift ==="

          swift --version

      - name: Install XcodeGen

        run: |

          brew install xcodegen

      - name: Show Project Spec

        run: |

          echo "=== project.yml ==="

          cat project.yml

      - name: Generate Xcode Project

        run: |

          xcodegen generate

      - name: Resolve Package Graph

        run: |

          xcodebuild \

            -project Idkllama.xcodeproj \

            -scheme Idkllama \

            -resolvePackageDependencies
